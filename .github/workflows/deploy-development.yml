name: Deploy development

on:
  push:
    branches:
      - impeccable-exploration

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to dev.caitlinhawley.com
    runs-on: ubuntu-latest

    environment:
      name: development
      url: https://dev.caitlinhawley.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Upload generated site
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ vars.SFTP_PATH }}
        run: |
          set -euo pipefail

          for variable in SFTP_HOST SFTP_PORT SFTP_USERNAME SSHPASS SFTP_PATH; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required development environment value: ${variable}" >&2
              exit 1
            fi
          done

          sshpass -e scp \
            -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -r \
            .output/public/. \
            "$SFTP_USERNAME@$SFTP_HOST:$SFTP_PATH/"